map $http_upgrade $edge_connection {
    default upgrade;
    "" "";
}

resolver 127.0.0.11 valid=10s ipv6=off;

ssl_certificate /certs/edge.crt;
ssl_certificate_key /certs/edge.key;

server {
    listen 443 ssl;
    server_name chat.etus.test;
    client_max_body_size 100m;
    large_client_header_buffers 4 32k;
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;

    location / {
        set $edge_chat http://nginx:80;
        proxy_pass $edge_chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $edge_connection;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 443 ssl;
    server_name idp.etus.test;

    location / {
        set $edge_idp http://fake-idp-hub:4001;
        proxy_pass $edge_idp;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl;
    server_name hub.etus.test;

    location / {
        set $edge_hub http://fake-idp-hub:4002;
        proxy_pass $edge_hub;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl;
    server_name router.etus.test;

    location / {
        set $edge_router http://fake-llm:4799;
        proxy_pass $edge_router;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
